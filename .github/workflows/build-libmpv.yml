name: 验证受控 libmpv 发布制品

on:
  pull_request:
    paths:
      - 'native/**'
      - 'docs/controlled-libmpv-release.md'
      - 'release/capabilities/**'
      - '.github/workflows/build-libmpv.yml'
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'docs/controlled-libmpv-release.md'
      - 'release/capabilities/**'
      - '.github/workflows/build-libmpv.yml'
  workflow_dispatch:
    inputs:
      run_cross_build:
        description: '手动触发基于受控源码目录的兼容性发布构建'
        required: false
        type: boolean
        default: false
      force_build:
        description: '强制执行受控发布构建（忽略变更检测）'
        required: false
        type: boolean
        default: false
      controlled_source_dir:
        description: '运行器上已按 sources.lock.json 固定提交准备的源码目录（不下载源码）'
        required: false
        type: string
        default: ''
      ohos_pkgconfig_dir:
        description: '运行器上 OpenHarmony ARM64 sysroot 的隔离 pkg-config 目录'
        required: false
        type: string
        default: ''
      ffmpeg_artifact_repository:
        description: '产出 FFmpeg shared prefix artifact 的 owner/repo'
        required: false
        type: string
        default: 'yaoshining/ohos_ijkplayer'
      ffmpeg_artifact_run_id:
        description: '产出 ffmpeg-8.0-ohos-arm64-v8a artifact 的不可变 workflow run ID'
        required: false
        type: string
        default: '31637632656'

permissions:
  actions: read
  contents: read

jobs:
  native-contracts:
    name: 原生受控构建契约
    runs-on: ubuntu-22.04
    steps:
      - name: 检出项目
        uses: actions/checkout@v4
      - name: 验证能力证据门禁
        run: bash native/tests/capability-evidence.test.sh
      - name: 验证 SDK 候选契约基线
        run: bash native/tests/contract-baseline.test.sh
      - name: 验证受控发布工具
        run: bash native/tests/controlled-release.test.sh
      - name: 验证既有补丁与打包约束
        run: |
          bash native/tests/build-libmpv-bootstrap.test.sh
          bash native/tests/build-libmpv-patches.test.sh
          bash native/tests/build-libmpv-workflow.test.sh
          bash native/tests/libmpv-packaging.test.sh

  detect-build-changes:
    name: 检测 libsmbclient 构建变更
    needs: native-contracts
    runs-on: ubuntu-22.04
    outputs:
      build-needed: ${{ steps.check.outputs.build-needed }}
    steps:
      - name: 检出项目
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 检测构建脚本或锁文件是否变更
        id: check
        run: |
          set -eu
          # workflow_dispatch 始终需要构建（手动触发）。
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build-needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES="native/scripts/build-libmpv-bootstrap.sh native/scripts/audit-libmpv-elf.sh native/patches/libmpv-ohos-build native/config/sources.lock.json .github/workflows/build-libmpv.yml"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" 2>/dev/null || true
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "build-needed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if git diff --name-only "$BASE"...HEAD -- $FILES | grep -q .; then
            echo "build-needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "build-needed=false" >> "$GITHUB_OUTPUT"
          fi

  build-libmpv-external-ffmpeg:
    name: 使用 ohos_ijkplayer FFmpeg 8 shared prefix 构建 libmpv
    needs: [native-contracts, detect-build-changes]
    if: ${{ needs.detect-build-changes.outputs.build-needed == 'true' || inputs.force_build }}
    runs-on: [self-hosted, macos, deveco]
    env:
      FFMPEG_ARTIFACT_REPOSITORY: ${{ inputs.ffmpeg_artifact_repository || 'yaoshining/ohos_ijkplayer' }}
      FFMPEG_ARTIFACT_RUN_ID: ${{ inputs.ffmpeg_artifact_run_id || '31637632656' }}
      RUST_TOOLCHAIN: 1.85.1
      CARGO_C_VERSION: 0.10.13
      CARGO_C_EXPECTED_VERSION: 0.10.13+cargo-0.88.0
      RUSTUP_VERSION: 1.28.2
    steps:
      - name: 检出项目
        uses: actions/checkout@v4
      - name: 下载受控 FFmpeg prefix artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 固定 producer workflow run ID，避免从“最新”artifact 引入浮动二进制。
          gh run download "$FFMPEG_ARTIFACT_RUN_ID" \
            --repo "$FFMPEG_ARTIFACT_REPOSITORY" \
            --name ffmpeg-8.0-ohos-arm64-v8a \
            --dir "${{ runner.temp }}/ffmpeg-8.0-ohos-arm64-v8a"
          test -s "${{ runner.temp }}/ffmpeg-8.0-ohos-arm64-v8a/VERSION"
      - name: 配置 OpenHarmony NDK
        run: |
          if [ -z "${OHOS_NDK:-}" ]; then
            for candidate in \
              "/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony" \
              "$HOME/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony" \
              "/Applications/DevEco-Studio.app/Contents/sdk/${HOS_SDK_VERSION:-10}/openharmony"; do
              if [ -x "$candidate/native/llvm/bin/clang" ] && [ -x "$candidate/native/llvm/bin/llvm-readelf" ]; then
                OHOS_NDK="$candidate"
                break
              fi
            done
          fi
          test -n "${OHOS_NDK:-}" || { echo '未找到 OpenHarmony NDK，请安装 DevEco Studio SDK 或设置 OHOS_NDK。' >&2; exit 1; }
          if [ -d "$OHOS_NDK/native/llvm/bin" ]; then
            toolchain="$OHOS_NDK/native/llvm/bin"
          else
            toolchain="$OHOS_NDK/llvm/bin"
          fi
          test -x "$toolchain/clang" || { echo "OpenHarmony clang 不可执行：$toolchain/clang" >&2; exit 1; }
          test -x "$toolchain/llvm-readelf" || { echo "OpenHarmony llvm-readelf 不可执行：$toolchain/llvm-readelf" >&2; exit 1; }
          echo "OHOS_NDK=$OHOS_NDK" >> "$GITHUB_ENV"
      - name: 准备 libmpv Rust 与下载工具
        run: |
          command -v curl >/dev/null 2>&1 || { echo '缺少 curl，无法准备受控 libmpv 构建工具。' >&2; exit 1; }
          if ! command -v rustup >/dev/null 2>&1; then
            case "$(uname -m)" in
              arm64) rustup_target='aarch64-apple-darwin'; rustup_sha='20ef5516c31b1ac2290084199ba77dbbcaa1406c45c1d978ca68558ef5964ef5' ;;
              x86_64) rustup_target='x86_64-apple-darwin'; rustup_sha='9c331076f62b4d0edeae63d9d1c9442d5fe39b37b05025ec8d41c5ed35486496' ;;
              *) echo "不支持的 rustup 主机架构：$(uname -m)" >&2; exit 1 ;;
            esac
            rustup_init="$RUNNER_TEMP/rustup-init"
            curl --proto '=https' --tlsv1.2 -fsSL --retry 5 \
              "https://static.rust-lang.org/rustup/archive/$RUSTUP_VERSION/$rustup_target/rustup-init" \
              -o "$rustup_init"
            printf '%s  %s\n' "$rustup_sha" "$rustup_init" | shasum -a 256 -c -
            chmod +x "$rustup_init"
            "$rustup_init" -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          cargo install cargo-c --version "=$CARGO_C_VERSION" --locked --features=vendored-openssl
          test "$(cargo-cbuild --version)" = "cargo-cbuild $CARGO_C_EXPECTED_VERSION" || {
            echo "cargo-c 版本不符合受控工具链要求：期望 $CARGO_C_EXPECTED_VERSION。" >&2
            exit 1
          }
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          # 上游会再次安装 cargo-c；受限 shim 强制复用已固定且兼容 Rust 1.85 的版本。
          TOOL_DIR="$RUNNER_TEMP/libmpv-tools"
          mkdir -p "$TOOL_DIR"
          cat > "$TOOL_DIR/cargo" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "${1:-}" = 'install' ] && [ "${2:-}" = 'cargo-c' ]; then
            command -v cargo-cbuild >/dev/null 2>&1 || { echo '固定 cargo-c 尚未安装。' >&2; exit 1; }
            exit 0
          fi
          exec "$HOME/.cargo/bin/cargo" "$@"
          EOF
          chmod +x "$TOOL_DIR/cargo"

          # 锁定上游使用 wget -qO；受限 shim 仅允许 HTTPS 下载，避免依赖 runner 的 Homebrew wget。
          cat > "$TOOL_DIR/wget" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "$#" -ne 3 ] || [ "${1:-}" != '-qO' ]; then
            echo 'wget shim 仅支持 -qO <输出文件> <https-url>' >&2
            exit 2
          fi
          output="$2"
          url="$3"
          case "$url" in
            https://*) ;;
            *) echo 'wget shim 只允许 HTTPS URL' >&2; exit 2 ;;
          esac
          if [ "$output" = '-' ]; then
            exec curl -fsSL --retry 5 --retry-all-errors "$url"
          fi
          exec curl -fsSL --retry 5 --retry-all-errors "$url" --output "$output"
          EOF
          chmod +x "$TOOL_DIR/wget"
          echo "$TOOL_DIR" >> "$GITHUB_PATH"
      - name: 构建并审计动态 FFmpeg libmpv
        env:
          VIDALL_PLAYER_FFMPEG_PREFIX: ${{ runner.temp }}/ffmpeg-8.0-ohos-arm64-v8a
        run: native/scripts/build-libmpv-bootstrap.sh
      - name: 验证审计、许可证与体积
        run: |
          python3 - <<'PY'
          import json
          report = json.load(open('dist/libmpv/arm64-v8a/elf-audit.json', encoding='utf-8'))
          assert report['status'] == 'passed', report
          assert not report['embeddedFfmpegSymbols'], report
          assert not report['sizeExceeded'], report
          PY
          test -s dist/ffmpeg-runtime/arm64-v8a/licenses/GPL-3.0-or-later.txt
          test -s dist/ffmpeg-runtime/arm64-v8a/MANIFEST.tsv
      - name: 上传 libmpv 制品
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-arm64-dynamic-ffmpeg8
          path: |
            dist/libmpv/arm64-v8a/libmpv.so
            dist/libmpv/arm64-v8a/libmpv.so.sha256
            dist/libmpv/arm64-v8a/elf-audit.json
          if-no-files-found: error
      - name: 独立上传最终宿主 HAP 的 FFmpeg runtime 输入
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-runtime-arm64
          path: dist/ffmpeg-runtime/arm64-v8a
          if-no-files-found: error

  cross-build-prerequisites:
    name: OpenHarmony ARM64 交叉构建前置条件
    needs: native-contracts
    # 真实交叉构建要求受控 SDK、不可变来源镜像和人工批准；PR 不自动触发。
    # 仅在手动提供了受控来源目录与 pkg-config 目录时运行，避免与
    # build-libsmbclient 的自动从源码构建路径混淆。
    if: ${{ inputs.run_cross_build && inputs.controlled_source_dir != '' && inputs.ohos_pkgconfig_dir != '' }}
    runs-on: [self-hosted, macos, deveco]
    timeout-minutes: 30
    steps:
      - name: 检出项目
        uses: actions/checkout@v4
      - name: 验证手动调度输入
        env:
          CONTROLLED_SOURCE_DIR: ${{ inputs.controlled_source_dir }}
          OHOS_PKGCONFIG_DIR: ${{ inputs.ohos_pkgconfig_dir }}
        run: |
          test -n "$CONTROLLED_SOURCE_DIR"
          test -n "$OHOS_PKGCONFIG_DIR"
          test -d "$CONTROLLED_SOURCE_DIR"
          test -d "$OHOS_PKGCONFIG_DIR"
          for component in mpv ffmpeg samba; do
            test -d "$CONTROLLED_SOURCE_DIR/$component"
          done
      - name: 验证 Samba 依赖闭包和交叉环境
        env:
          CONTROLLED_SOURCE_DIR: ${{ inputs.controlled_source_dir }}
          PKG_CONFIG_LIBDIR: ${{ inputs.ohos_pkgconfig_dir }}
        run: |
          python3 - native/config/sources.lock.json <<'PY'
          import json
          import sys

          samba = json.load(open(sys.argv[1], encoding='utf-8'))['sources']['samba']
          status = samba['build']['dependencyClosureStatus']
          if status != 'complete':
              raise SystemExit(
                  'Samba/libsmbclient 传递依赖闭包尚未锁定；'
                  '拒绝执行真实 OpenHarmony ARM64 交叉构建。'
              )
          PY
          test -f "$PKG_CONFIG_LIBDIR/smbclient.pc"
          grep -Fx -- '--enable-libsmbclient' "$CONTROLLED_SOURCE_DIR/ffmpeg/configure-options.txt"
      - name: 生成受控 libmpv 审计制品
        env:
          CONTROLLED_SOURCE_DIR: ${{ inputs.controlled_source_dir }}
          PKG_CONFIG_LIBDIR: ${{ inputs.ohos_pkgconfig_dir }}
          RELEASE_DIR: ${{ runner.temp }}/libmpv-cross-build
        run: |
          native/scripts/build-libmpv-controlled.sh \
            --source "$CONTROLLED_SOURCE_DIR" \
            --output "$RELEASE_DIR" \
            --skip-compile
          test -s "$RELEASE_DIR/libmpv.so"
          test -s "$RELEASE_DIR/elf-audit.json"
          test -s "$RELEASE_DIR/feature-manifest.json"
          test -s "$RELEASE_DIR/sbom.spdx.json"
          test -s "$RELEASE_DIR/sbom.cdx.json"
          test -s "$RELEASE_DIR/NOTICE"
      - name: 上传交叉构建前置条件审计制品
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-cross-build-prerequisites
          path: ${{ runner.temp }}/libmpv-cross-build
          if-no-files-found: error

  clean-environment:
    name: 清洁环境元数据验证 (${{ matrix.os }})
    needs: native-contracts
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出项目
        uses: actions/checkout@v4
      - name: 验证锁定来源与生成制品
        env:
          AUDIT_DIR: ${{ runner.temp }}/libmpv-release-audit
        run: |
          rm -rf "$AUDIT_DIR"
          mkdir -p "$AUDIT_DIR/source/mpv" "$AUDIT_DIR/source/ffmpeg"
          printf '%s\n' --enable-static > "$AUDIT_DIR/source/ffmpeg/configure-options.txt"
          printf '%s\n' -Dgpl=true > "$AUDIT_DIR/source/mpv/meson-options.txt"
          native/scripts/generate-libmpv-manifest.sh --lock native/config/sources.lock.json --source "$AUDIT_DIR/source" --output "$AUDIT_DIR/feature-manifest.json" --abi arm64-v8a --min-sdk 15 --build-time 0
          native/scripts/generate-sbom.sh --lock native/config/sources.lock.json --format spdx --output "$AUDIT_DIR/sbom.spdx.json"
          native/scripts/generate-sbom.sh --lock native/config/sources.lock.json --format cyclonedx --output "$AUDIT_DIR/sbom.cdx.json"
          native/scripts/audit-licenses.sh --lock native/config/sources.lock.json --output "$AUDIT_DIR/license-audit.json"
          native/scripts/collect-licenses.sh --lock native/config/sources.lock.json --output "$AUDIT_DIR/NOTICE"
          test -s "$AUDIT_DIR/NOTICE"
      - name: 上传审计制品
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-release-audit-${{ matrix.os }}
          path: ${{ runner.temp }}/libmpv-release-audit
          if-no-files-found: error
      - name: 说明交叉构建门禁
        run: echo '实际 OpenHarmony 交叉编译仅在包含锁定 SDK 的受控发布环境执行；该 CI 验证所有可移植的锁定、审计及制品生成契约。'
