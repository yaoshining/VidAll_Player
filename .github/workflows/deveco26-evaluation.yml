name: 手动云端 Mac 构建指定分支
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 仓内待构建分支（上方工作流运行分支请选择 main）
        type: string
        required: true
      target:
        description: Player 模块目标
        type: choice
        options: [default, deveco26]
        default: default

permissions:
  contents: read

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 在审批前锁定仓内分支提交
        id: pin
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$BRANCH"
          commit="$(git ls-remote --exit-code --refs origin "refs/heads/$BRANCH" | cut -f1)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
  evaluation:
    name: 云端构建 ${{ inputs.branch }}（${{ needs.resolve.outputs.commit }}）
    needs: resolve
    environment: deveco26-build
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 记录主线工作流身份并初始化
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/manual-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out/work" "$out/source-build/work"
          echo "CI_OUT=$out" >> "$GITHUB_ENV"
          echo "STUDIO=$out/environment/mounted/DevEco-Studio.app" >> "$GITHUB_ENV"
          python3 -B scripts/test/normal-core/ci-context.py --out "$out/work"
      - name: 使用主线脚本准备已锁定的私有 SDK
        id: bootstrap
        env:
          DEVECO26_RELEASE_READ_TOKEN: ${{ secrets.DEVECO26_RELEASE_READ_TOKEN }}
        run: python3 -B scripts/test/deveco26/release-source.py --out "$CI_OUT"
      - uses: actions/checkout@v4
        id: source
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          path: source
          persist-credentials: false
      - name: 构建审批时选定的源码和模块
        working-directory: source
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.commit }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          [[ "$TARGET" == default || "$TARGET" == deveco26 ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          export HVIGOR_USER_HOME="$CI_OUT/source-build/hvigor-home" DEVECO_CLI_STUDIO_PATH="$STUDIO" DEVECO_CLI_SKIP_VERSION_CHECK=1
          node="$STUDIO/Contents/tools/node/bin/node"
          cli="$CI_OUT/environment/cli/node_modules/@deveco/deveco-cli/cli.js"
          "$node" "$cli" build clean
          "$node" "$cli" build --modules "vidall_player@$TARGET"
          shopt -s nullglob
          files=(packages/vidall-player/build/default/outputs/"$TARGET"/*.har)
          [[ ${#files[@]} -eq 1 ]]
          mkdir -p "$CI_OUT/artifact"
          cp "${files[0]}" "$CI_OUT/artifact/"
          cd "$CI_OUT/artifact"
          shasum -a 256 *.har > SHA256SUMS
          printf '%s\n' "$SOURCE_SHA" > SOURCE_COMMIT
      - name: 清理构建进程和只读挂载
        id: cleanup
        if: always()
        shell: bash
        run: |
          set -u
          [[ -n "${CI_OUT:-}" ]] || exit 0
          rc=0
          if [[ -d "$CI_OUT/source-build/hvigor-home" ]]; then
            python3 -B scripts/test/branch-ci/stop-project.py --project source --studio "$STUDIO" --out "$CI_OUT/source-build" || rc=1
          fi
          python3 -B scripts/test/deveco26/bootstrap.py cleanup --out "$CI_OUT" || rc=1
          exit "$rc"
      - name: 上传已核验的手动云构建产物
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: cloud-har-${{ needs.resolve.outputs.commit }}-${{ github.run_attempt }}
          path: ${{ env.CI_OUT }}/artifact/
          if-no-files-found: error
          retention-days: 14
