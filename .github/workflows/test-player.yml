name: 诊断宿主回归（Hypium编译归入DevEco26）

on:
  pull_request:
    paths:
      - 'entry/src/ohosTest/**'
      - 'entry/src/main/ets/pages/DiagnosticsProbe.ets'
      - 'entry/src/main/ets/entryability/EntryAbility.ets'
      - 'entry/src/main/resources/base/profile/main_pages.json'
      - 'entry/src/main/ets/player/DiagnosticsProbeChecks.ets'
      - 'scripts/test/diagnostics79/**'
      - 'scripts/test/audio-evidence/**'
      - 'fixtures/normal-core-consumer/audio-evidence/**'
      - 'fixtures/normal-core-consumer/recovery-*/**'
      - 'entry/build-profile.json5'
      - 'entry/oh-package.json5'
      - 'entry/oh-package-lock.json5'
      - 'packages/vidall-player/**'
      - 'native/diagnostics/**'
      - 'native/tests/**'
      - 'native/patches/mpv/**'
      - 'native/patches/phase30/**'
      - 'native/mpv/**'
      - 'native/scripts/prepare-audio-ci-input.py'
      - 'release/inputs/004-normal-core/provenance/host-recovery-input.json'
      - 'release/inputs/004-normal-core/arm64-v8a/libmpv.so'
      - 'build-profile.json5'
      - 'oh-package.json5'
      - 'oh-package-lock.json5'
      - '.github/workflows/test-player.yml'
      - 'scripts/test/cloud-build/**'
      - 'scripts/release/*candidate-integrity.py'
      - 'scripts/release/*source-consistency.py'
      - 'fixtures/libmpv-player-consumer/**'
      - 'scripts/signing/**'
      - 'signing/README.md'
  push:
    branches: [main]
    paths:
      - 'entry/src/ohosTest/**'
      - 'entry/src/main/ets/pages/DiagnosticsProbe.ets'
      - 'entry/src/main/ets/entryability/EntryAbility.ets'
      - 'entry/src/main/resources/base/profile/main_pages.json'
      - 'entry/src/main/ets/player/DiagnosticsProbeChecks.ets'
      - 'scripts/test/diagnostics79/**'
      - 'scripts/test/audio-evidence/**'
      - 'fixtures/normal-core-consumer/audio-evidence/**'
      - 'fixtures/normal-core-consumer/recovery-*/**'
      - 'entry/build-profile.json5'
      - 'entry/oh-package.json5'
      - 'entry/oh-package-lock.json5'
      - 'packages/vidall-player/**'
      - 'native/diagnostics/**'
      - 'native/tests/**'
      - 'native/patches/mpv/**'
      - 'native/patches/phase30/**'
      - 'native/mpv/**'
      - 'native/scripts/prepare-audio-ci-input.py'
      - 'release/inputs/004-normal-core/provenance/host-recovery-input.json'
      - 'release/inputs/004-normal-core/arm64-v8a/libmpv.so'
      - 'build-profile.json5'
      - 'oh-package.json5'
      - 'oh-package-lock.json5'
      - '.github/workflows/test-player.yml'
      - 'scripts/test/cloud-build/**'
      - 'scripts/release/*candidate-integrity.py'
      - 'scripts/release/*source-consistency.py'
      - 'fixtures/libmpv-player-consumer/**'
      - 'scripts/signing/**'
      - 'signing/README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-regressions:
    name: 完整14项CTest与2项诊断JS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装锁定TypeScript
        run: npm ci --prefix scripts/test/normal-core --ignore-scripts --no-audit --no-fund
      - name: 系统内录证据工具与真实焦点流程宿主回归
        run: python3 -B scripts/test/audio-evidence/run.py --out "$RUNNER_TEMP/audio-evidence"
      - name: 校验发布审计工具和示例公开入口
        run: |
          python3 -B scripts/release/test-candidate-integrity.py
          python3 -B scripts/release/test-source-consistency.py
          bash native/tests/fixture-public-import.test.sh
      - name: 检出锁定的 mpv 音频源
        uses: actions/checkout@v4
        with:
          repository: ErBWs/mpv
          ref: 6edeee00a07b9b76f197aa71eee3d029fb090de4
          path: .cache/mpv-interrupt
          persist-credentials: false
      - name: 当前交付音频源、中断与恢复回归
        shell: bash
        run: |
          set -euo pipefail
          AUDIO_OUT="$RUNNER_TEMP/player-audio-regressions"
          mkdir -p "$AUDIO_OUT"
          python3 -B native/tests/audio-interrupt/prepare.test.py 2>&1 | tee "$AUDIO_OUT/prepare-tests.log"
          python3 -B native/tests/audio-interrupt/ci-input.test.py 2>&1 | tee "$AUDIO_OUT/ci-input-tests.log"
          python3 -B native/scripts/prepare-audio-ci-input.py --source .cache/mpv-interrupt --output "$AUDIO_OUT/mpv" 2>&1 | tee "$AUDIO_OUT/input.log"
          python3 -B native/tests/audio-interrupt/interrupt.test.py "$AUDIO_OUT/mpv" 2>&1 | tee "$AUDIO_OUT/interrupt.log"
          python3 -B native/tests/audio-interrupt/legacy-lifetime.test.py "$AUDIO_OUT/mpv" 2>&1 | tee "$AUDIO_OUT/legacy-lifetime.log"
          python3 -B native/tests/host-survival/audio-data.test.py "$AUDIO_OUT/mpv" 2>&1 | tee "$AUDIO_OUT/data.log"
          python3 -B native/tests/host-survival/audio-control.test.py "$AUDIO_OUT/mpv" 2>&1 | tee "$AUDIO_OUT/control.log"
          python3 -B native/tests/host-survival/audio-lifecycle.test.py "$AUDIO_OUT/mpv" 2>&1 | tee "$AUDIO_OUT/lifecycle.log"
      - name: 保存音频回归结果与源码身份
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-audio-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/audio-evidence/
            ${{ runner.temp }}/player-audio-regressions/*.log
            ${{ runner.temp }}/player-audio-regressions/mpv/audio-input.json
          if-no-files-found: error
          retention-days: 14
      - name: 窗口旋转、重绘与媒体结束事件回归
        run: |
          python3 -B native/tests/vulkan-size/resize.test.py packages/vidall-player/src/main/cpp/napi_init.cpp
          python3 -B native/tests/surface-resize/gl.test.py packages/vidall-player/src/main/cpp/napi_init.cpp
          python3 -B native/tests/surface-resize/sw.test.py packages/vidall-player/src/main/cpp/napi_init.cpp
          python3 -B native/tests/completion-event.test.py
      - name: 完整真实宿主回归
        run: python3 -B scripts/test/cloud-build/host.py --out "$RUNNER_TEMP/legacy-native"
      - name: 保存失败和成功文本
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-native-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/legacy-native/work/
          if-no-files-found: error
          retention-days: 14
