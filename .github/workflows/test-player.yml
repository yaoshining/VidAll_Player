name: 旧基线旋转与播完修复 HAR（iMac CI）

on:
  push:
    branches: [codex/legacy-rotation-completion-84, codex/legacy-vulkan-size-83]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy84-har-${{ github.ref }}
  cancel-in-progress: false

jobs:
  legacy-har:
    name: 旧基线回归、完整 HAR 与依赖校验
    runs-on: [self-hosted, macOS, deveco]
    timeout-minutes: 30
    steps:
      - name: 检出本次事件提交
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 初始化隔离构建目录与现有工具链
        shell: bash
        run: |
          set -euo pipefail
          CI_WORK_DIR="$RUNNER_TEMP/legacy84-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$CI_WORK_DIR/logs" "$CI_WORK_DIR/artifact"
          echo "CI_WORK_DIR=$CI_WORK_DIR" >> "$GITHUB_ENV"
          echo "HVIGOR_USER_HOME=$CI_WORK_DIR/hvigor" >> "$GITHUB_ENV"
          echo "DEVECO_CLI_STUDIO_PATH=/Applications/DevEco-Studio.app" >> "$GITHUB_ENV"
          echo "DEVECO_CLI_SKIP_VERSION_CHECK=1" >> "$GITHUB_ENV"
          echo "TYPESCRIPT_PATH=$GITHUB_WORKSPACE/scripts/test/legacy83-ci/node_modules/typescript" >> "$GITHUB_ENV"
          test -x /Applications/DevEco-Studio.app/Contents/tools/node/bin/node
          git diff --exit-code HEAD --

      - name: 安装固定 CLI 与主机测试依赖
        run: npm ci --prefix scripts/test/legacy83-ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: 主机回归与 CI 失败路径测试
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 -B scripts/test/legacy83-ci/audit.test.py
            node scripts/test/legacy83-ci/workflow.test.cjs
            python3 -B native/tests/vulkan-size/resize.test.py packages/vidall-player/src/main/cpp/napi_init.cpp
            python3 -B native/tests/surface-resize/gl.test.py packages/vidall-player/src/main/cpp/napi_init.cpp
            python3 -B native/tests/surface-resize/sw.test.py packages/vidall-player/src/main/cpp/napi_init.cpp
            python3 -B native/tests/completion-event.test.py
            python3 -B native/tests/legacy-runtime.test.py
            cmake -S native/tests -B "$CI_WORK_DIR/native-tests"
            cmake --build "$CI_WORK_DIR/native-tests" -j 4
            ctest --test-dir "$CI_WORK_DIR/native-tests" --output-on-failure
            node native/tests/diagnostics-session.test.cjs
            node native/tests/diagnostics-device.test.cjs
          } 2>&1 | tee "$CI_WORK_DIR/logs/tests.log"

      - name: 完整构建 Player HAR
        id: build
        shell: bash
        run: |
          set -euo pipefail
          NODE="$DEVECO_CLI_STUDIO_PATH/Contents/tools/node/bin/node"
          CLI="$GITHUB_WORKSPACE/scripts/test/legacy83-ci/node_modules/@deveco/deveco-cli/cli.js"
          "$NODE" "$CLI" build clean 2>&1 | tee "$CI_WORK_DIR/logs/clean.log"
          "$NODE" "$CLI" build --modules vidall_player@default 2>&1 | tee "$CI_WORK_DIR/logs/build.log"

      - name: 核对当前提交、核心字节、ABI 和实际工具链
        id: audit
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/test/legacy83-ci/audit.py --out "$CI_WORK_DIR/artifact" --studio "$DEVECO_CLI_STUDIO_PATH" 2>&1 | tee "$CI_WORK_DIR/logs/audit.log"

      - name: 上传通过校验的 CI HAR
        id: har
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: legacy84-ci-har-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.CI_WORK_DIR }}/artifact/
          if-no-files-found: error
          retention-days: 30

      - name: 保存本次成功或失败记录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy84-ci-logs-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.CI_WORK_DIR }}/logs/
          if-no-files-found: warn
          retention-days: 14
