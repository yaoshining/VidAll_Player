[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
[binaries]
c = '/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/native/llvm/bin/clang'
cpp = '/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/native/llvm/bin/clang++'
ar = '/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/native/llvm/bin/llvm-ar'
strip = '/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/native/llvm/bin/llvm-strip'
pkg-config = '/opt/homebrew/bin/pkg-config'
[built-in options]
c_args = ['--target=x86_64-linux-ohos', '--sysroot=/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/native/sysroot', '-fPIC', '-D__MUSL__=1', '-ffile-prefix-map=/private/tmp/vidall-x86-frozen-build-3=/vidall-player/build']
cpp_args = ['--target=x86_64-linux-ohos', '--sysroot=/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/native/sysroot', '-fPIC', '-D__MUSL__=1', '-ffile-prefix-map=/private/tmp/vidall-x86-frozen-build-3=/vidall-player/build']
c_link_args = ['--target=x86_64-linux-ohos', '-fuse-ld=lld', '-lc++_shared']
cpp_link_args = ['--target=x86_64-linux-ohos', '-fuse-ld=lld', '-lc++_shared']
[properties]
needs_exe_wrapper = true
